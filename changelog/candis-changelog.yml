- title: Three-Way Match
  date_approx: '2026-03'
  url: https://developer.candis.io/changelog/three-way-match
  type: addition
  highlights:
  - Match invoices against purchase orders and goods receipts before export.
  - Import/update purchase orders and goods receipts from the ERP (idempotent by order number).
  - Import/update additional delivery costs (freight, handling) linked during approval.
  - Exported split postings gain purchaseOrderMetadata, goodsReceiptMetadata, additionalDeliveryCostsMetadata and a type field (ITEM vs supplementary charge).
- title: New Purchase Requests API (beta)
