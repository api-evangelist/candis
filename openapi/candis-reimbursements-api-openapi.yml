                                    bankAccountNumber:
                                      type: string
                                      description: Bank account number
                                      example: '1234567890'
                                      nullable: true
                                    accountHolder:
                                      type: string
                                      description: Account holder
                                      example: John Doe
                                      nullable: true
                                  required:
