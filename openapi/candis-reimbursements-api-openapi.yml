                              properties:
                                name:
                                  type: string
                                  description: Contact name
                                  example: John Doe
                                accountsPayableNumber:
                                  type: string
                                  description: Contact payable number
                                  example: K1349234
                                  nullable: true
                                paymentInfo:
                                  type: object
                                  properties:
                                    iban:
                                      type: string
                                      description: IBAN
                                      example: DE12345678901234567890
                                    swiftCode:
                                      type: string
                                      description: SWIFT code
                                      example: BIC123456789
