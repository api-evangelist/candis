  /v1/organizations/{organizationId}/exports/{exportId}/postings:
    get:
      operationId: getExportPostings
      summary: Get a list of Export Postings
      description: Get a list of Postings that were exported in the Export.
      parameters:
      - name: exportId
        required: true
        in: path
        description: The export ID.
        example: 86e29aff-ba75-492d-85f6-80d802c4fe69
        schema:
          type: string
      - name: organizationId
        required: true
        in: path
        description: The organization ID.
        example: alpha-organization
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  successfulPostings:
                    type: array
                    description: Successfully exported invoices
                    items:
                      oneOf:
                      - title: Invoice Posting
                        type: object
                        properties:
                          id:
                            type: string
                            description: Unique identifier of Entity
                            example: e4cf0d1b-8514-4437-9b7f-2648b87ec8f5
                          entityGuid:
                            type: string
                            description: Candis Unique identifier of the posting.
                            example: e4cf0d1b-8514-4437-9b7f-2648b87ec8f5
                          status:
                            type: string
                            description: 'Status of the posting.<br>Exported: The posting was successfully exported.'
                            enum:
                            - EXPORTED
                            example: EXPORTED
                          amount:
                            description: Total Amount information of the posting.
                            allOf:
                            - type: object
                              properties:
                                value:
                                  type: number
                                  description: Total amount of the posting.
                                  example: 100
                                currencyCode:
                                  type: string
                                  description: ISO 4217 currency code.
                                  example: EUR
                              required:
                              - value
                              - currencyCode
                          contact:
                            description: Contact information.
                            allOf:
                            - type: object
                              properties:
                                accountsPayableNumber:
                                  type: string
                                  description: Accounts payable number.
                                  example: '7000001'
                                accountsReceivableNumber:
                                  type: string
                                  description: Accounts receivable number.
                                  example: '7000004'
                                name:
                                  type: string
                                  description: Name of the contact.
                                  example: John Doe
                          invoiceId:
                            type: string
                            description: Invoice ID / Invoice Number mentioned on the invoice.
                            example: '1234'
                          invoiceDate:
                            type: string
                            format: date-time
                            description: Date of the posting.
                            example: '2024-01-01T00:00:00Z'
                          purchaseOrder:
                            description: Purchase Order Information.
                            allOf:
                            - type: object
                              properties:
                                orderNumber:
                                  type: string
                                  description: Purchase Order number attached to the Posting.
                                  example: PO-001
                              required:
                              - orderNumber
                          files:
                            description: Downloadable files information.
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: File id
                                  example: 60ace9d227d897fc64add503
                                url:
                                  type: string
                                  description: Download URL of the file.
                                  example: https://api.candis.io/v1/organization/org-id/files/60ace9d227d897fc64add503
                                name:
                                  type: string
                                  description: Name of the file.
                                  example: invoice.pdf
                                type:
                                  type: string
                                  enum:
                                  - AUDIT_TRAIL
                                  - ATTACHMENT
                                  - INVOICE
                                  - XRECHNUNG
                                  description: 'Type of the file.<br><br>AUDIT_TRAIL: Contains all the activity related to processing of the posting.<br>ATTACHMENT: Contains additional information related to the posting.<br>INVOICE: The invoice pdf document.<br>XRECHNUNG: The XRechnung xml document.'
                                  example: INVOICE
                              required:
                              - id
                              - url
                              - name
                              - type
                          url:
                            type: string
                            description: Candis URL of the posting.
                            example: https://my.candis.io/alpha-organization/archive/e4cf0d1b-8514-4437-9b7f-2648b87ec8f5
                          accountingArea:
                            description: Accounting Area Information.
                            allOf:
                            - type: object
                              properties:
                                name:
                                  type: string
                                  description: Accounting Area attached to the Posting.
                                  example: AA-001
                                description:
                                  type: string
                                  description: Description of Accounting Area attached to the Posting.
                                  example: Accounting Area 1
                              required:
                              - name
                              - description
                          deliveryDate:
                            type: string
                            format: date-time
                            description: Date of the posting.
                            example: '2024-01-01T00:00:00Z'
                          invoiceFormat:
                            type: string
                            enum:
                            - REGULAR
                            - XRECHNUNG
                            - ZUGFERD
                            description: 'Format of the invoice.<br>REGULAR: Regular invoice format.<br>XRECHNUNG: XRechnung invoice format.<br>ZUGFERD: ZUGFeRD invoice format.'
                            example: REGULAR
                          dueDate:
                            type: string
                            format: date-time
                            description: Due date of the booking.
                            example: '2024-01-01T00:00:00Z'
                          paymentCondition:
                            description: Payment Condition Details
                            allOf:
                            - type: object
                              properties:
                                name:
                                  type: string
                                  description: Payment Condition Name
                                  example: Credit Card Discount
                                  nullable: true
                                discountPercentage:
                                  type: number
                                  description: Discount Percentage
                                  example: 10
                                  nullable: true
                                discountPaymentDate:
                                  type: string
                                  format: date-time
                                  description: Discount Payment Date
                                  example: '2024-01-01T00:00:00Z'
                          documentType:
                            type: string
                            description: Document type of the Posting.
                            example: Incoming Invoice, Outgoing Invoice
                          splitPostings:
                            description: Split-postings can be a part of a posting. A split-posting contains a specific portion of an invoice, which could be necessary due to the need for a different GLA (General Ledger Account) for an amount or when more than one tax is applicable to an invoice.
                            type: array
                            items:
                              type: object
                              properties:
                                note:
                                  type: string
                                  description: Note for the split-posting.
                                  example: Some note
                                amount:
                                  type: number
                                  description: Amount of the split-posting.
                                  example: 100
                                costCenter:
                                  description: Cost center.
                                  allOf:
                                  - type: object
                                    properties:
                                      code:
                                        type: string
                                        description: Code of the cost center.
                                        example: CC-123
                                    required:
                                    - code
                                costObject:
                                  description: Cost object.
                                  allOf:
                                  - type: object
                                    properties:
                                      code:
                                        type: string
                                        description: Code of the cost center.
                                        example: CC-123
                                    required:
                                    - code
                                customCostDimension:
                                  description: Custom cost dimension.
                                  allOf:
                                  - type: object
                                    properties:
                                      code:
                                        type: string
                                        description: Code of the cost center.
                                        example: CC-123
                                    required:
                                    - code
                                bookingKey:
                                  description: Booking key.
                                  allOf:
                                  - type: object
                                    properties:
                                      taxCode:
                                        type: string
                                        description: Tax code.
                                        example: '9'
                                    required:
                                    - taxCode
                                postingText:
                                  type: string
                                  description: Posting text.
                                  example: Some text
                                unitPrice:
                                  type: number
                                  description: Unit price of the booking.
                                  example: 10.5
                                quantity:
                                  type: number
                                  description: Quantity of the booking.
                                  example: 4
                                netAmount:
                                  type: number
                                  description: Net amount of the booking.
                                  example: 42.02
                                taxAmount:
                                  type: number
                                  description: Tax amount of the booking.
                                  example: 7.98
                                type:
                                  type: string
