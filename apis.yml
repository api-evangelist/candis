aid: candis
name: Candis
description: >-
  Candis is a Berlin-based fintech (founded 2015) offering an AI-driven financial process
  automation and accounts-payable platform for SMEs. It captures incoming invoices, reads
  invoice data via OCR (business partner, amount, date, IBAN), routes them through approval
  workflows, and exports approved postings to accounting systems and ERPs. As a licensed
  DATEV interface partner it also integrates with Sage and Wolters Kluwer, and supports
  three-way matching of invoices against purchase orders and goods receipts. Candis exposes
  a public REST API (developer.candis.io) with an Export API, Core Data API, and read-only
  Invoice, Reimbursement Item, and Purchase Request Data APIs, secured with OAuth2/OIDC and
  fronted by an official MCP server.
